name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Install CocoaPods (if Podfile exists)
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update
          else
            echo "No Podfile found, skipping pod install."
          fi

      - name: Build Unsigned Release iOS
        run: flutter build ios --release --no-codesign

      - name: Package as Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r hafezi_quran_majeed.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hafezi-quran-majeed-ipa
          path: hafezi_quran_majeed.ipa