name: hafezi_quran_majeed
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Bengali
      fonts:
       - asset: assets/fonts/kalpurush.ttf

    - family: Arabic
      fonts:
       - asset: assets/fonts/arabic.ttf

  assets:
    - assets/images/pages/
    - assets/images/